name: ci

on:
  push:
    branches:
      - main
  pull_request:

# The workflow only reads the repository. Publishing happens in release.yml,
# which asks for write access explicitly.
permissions:
  contents: read

# Pushing twice in quick succession should not leave two of these running, now
# that a job in here starts real Mattermost servers.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps the toolchain in step with go.mod rather than pinning it twice.
  GOFLAGS: -mod=readonly

jobs:
  check-style:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Validate the plugin manifest
        run: make manifest-check

      - name: Generate the manifest sources
        run: make apply

      - name: Check Go formatting
        run: |
          unformatted="$(gofmt -l server build)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet the server
        run: go vet ./server/...

      - name: Lint the server
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      - name: Lint the webapp
        run: npm run lint
        working-directory: webapp

      - name: Type-check the webapp
        run: npm run check-types
        working-directory: webapp

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate the manifest sources
        run: make apply

      # The race detector is not optional here: the scheduler, the compare-and-set
      # loops and the delivery claim protocol are the parts most worth testing,
      # and they are all concurrent.
      - name: Run the server tests
        run: go test -race -count 1 ./server/...

  test-webapp:
    name: Webapp tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Generate the manifest sources
        run: make apply

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      - name: Run the webapp tests
        run: npm run test-ci
        working-directory: webapp

  test-integration:
    # The suite installs the plugin into a real Mattermost server and checks,
    # among other things, that a reminder is genuinely delivered. It is the only
    # thing that catches a plugin which fails to activate — the kind of bug that
    # every unit test will happily report as passing.
    name: Integration (Mattermost ${{ matrix.mattermost }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Both versions always report. Knowing whether a failure is specific to
      # one of them is most of the diagnosis.
      fail-fast: false
      matrix:
        # The two ends of the supported range: the minimum the manifest
        # declares, and the current release.
        mattermost: ['9.5', 'latest']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      # Docker is already running on the GitHub runners, and they are amd64, so
      # the platform juggling that a developer machine needs is a no-op here.
      - name: Run the integration suite
        run: make test-integration MM_TEST_IMAGE=mattermost/mattermost-team-edition:${{ matrix.mattermost }}

  cluster:
    name: Two-node cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Install webapp dependencies
        run: npm ci
        working-directory: webapp

      # Two Mattermost servers against one Postgres, each running its own copy
      # of the plugin, with reminders due at the same moment. Slower than the
      # single-node suite because the schedulers run on their own timers rather
      # than an injected clock, which is the point of it.
      - name: Run the two-node cluster test
        run: make test-cluster

      # The containers are gone by now either way; this is here so a failure
      # leaves something to read in the job log.
      - name: Show the node logs on failure
        if: failure()
        run: docker compose -f dev/cluster/docker-compose.yml logs --tail 200 || true

  build:
    name: Build the plugin bundle
    runs-on: ubuntu-latest
    needs:
      - check-style
      - test-server
      - test-webapp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Build the bundle
        run: make dist

      - name: Check the bundle contains what the manifest promises
        run: ./build/check-bundle.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v7
        with:
          name: plugin-bundle
          path: |
            dist/*.tar.gz
            dist/checksums.txt
          if-no-files-found: error
          retention-days: 14
