name: release

# Releases are deliberately manual. Nothing is published by merging to main:
# a maintainer pushes a signed version tag, or runs this workflow by hand.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'The existing tag to build and publish, for example v0.1.0'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    # Only this job can write to the repository, and only to create the release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      - name: Check the tag matches the manifest version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"

          # build/bin is gitignored, so the manifest tool does not exist in a
          # fresh checkout and has to be built before it can be asked anything.
          # Any make target builds it, as a side effect of build/setup.mk.
          make apply >/dev/null
          manifest_version="v$(./build/bin/manifest version)"

          echo "tag=$tag manifest=$manifest_version"
          if [ "$tag" != "$manifest_version" ]; then
            echo "The tag and the version in plugin.json disagree. Bump plugin.json first."
            exit 1
          fi

      # Forgetting the changelog is the easiest mistake to make at release time
      # and the most annoying to correct afterwards, because the release notes
      # are already out. Checked before anything is built.
      - name: Check the changelog has an entry for this version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"

          heading="$(grep -E "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md || true)"
          if [ -z "$heading" ]; then
            echo "CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' heading."
            echo "Add one, dated the day you are releasing."
            exit 1
          fi
          echo "found: $heading"

          # A date left over from drafting is worse than none, because it is
          # believed. Today or yesterday is fine; anything else is a leftover.
          dated="${heading##*- }"
          today="$(date -u +%F)"
          yesterday="$(date -u -d yesterday +%F 2>/dev/null || date -u -v-1d +%F)"
          if [ "$dated" != "$today" ] && [ "$dated" != "$yesterday" ]; then
            echo "The changelog dates ${version} as ${dated}, but today is ${today}."
            echo "Update it to the day you are actually releasing."
            exit 1
          fi

          if ! grep -qE "^## \[Unreleased\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no Unreleased section for work after this release."
            exit 1
          fi

      - name: Run the tests
        run: |
          make apply
          go test -race -count 1 ./server/...
          cd webapp && npm ci && npm run test-ci

      - name: Build the bundle
        run: make dist

      - name: Check the bundle contains what the manifest promises
        run: ./build/check-bundle.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          cat checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt
